server {
    listen 8080;
    server_name _;
    root /var/www/html/tests/runtime/public;
    index fpm.php;

    location / {
        try_files $uri /fpm.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/fpm.php;
        fastcgi_param SCRIPT_NAME /fpm.php;
        fastcgi_pass fpm:9000;
    }
}
